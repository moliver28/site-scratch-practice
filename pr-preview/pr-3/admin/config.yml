backend:
  name: github
  repo: moliver28/site-scratch-practice
  branch: main
  # Editorial Workflow: edits open draft PRs instead of committing directly.
  publish_mode: editorial_workflow

media_folder: static/uploads
public_path: /site-scratch-practice/uploads
site_url: https://moliver28.github.io/site-scratch-practice/
base_url: https://moliver28.github.io
locale: en

collections:
  # Practice CMS fragment (#78): practice vocabulary in the labels — the
  # entities collection stays catchall, so any entry kind the select omits
  # is still valid data. Content-model source kit (facts only):
  # https://github.com/moliver28/karahokes-website — see packs/practice/pack.jinja.
  - name: practice
    label: Practice
    folder: src/content/entities
    format: yaml
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Name, name: name, widget: string }
      - label: Entry kind
        name: type
        widget: select
        default: service
        options: [profile, service, faq, insurance_plan, community, concerns, process_step, book, resource]
      - { label: Summary, name: summary, widget: text, required: false }
      # Free-form fields: add any key; the theme renders unknown fields
      # automatically (see AGENTS.md).

  - name: pages
    label: Pages
    folder: src/content/pages
    format: frontmatter
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Order, name: order, widget: number, default: 10 }
      - { label: Body, name: body, widget: markdown }
