name: What therapy costs
type: faq
question: What does therapy cost?
answer: >-
  If you are using insurance session payment depends on your deductible
  and individual plan. Most people’s co-pays range between 15-30 dollars
  per session. Out of pocket sessions are $150 each. If you’re uninsured
  and money is what’s keeping you from care, email me and we’ll talk about
  sliding-scale options (a lower fee based on what you can afford).
