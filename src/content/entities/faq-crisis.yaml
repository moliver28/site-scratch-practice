name: Crisis support
type: faq
question: What if I’m in crisis right now?
answer: >-
  I’m not a crisis service, and this practice isn’t staffed around the
  clock. If you’re in immediate danger, call 911 or go to your nearest
  emergency room. Call or text 988 for the Suicide & Crisis Lifeline;
  veterans can dial 988 and press 1 for the Veterans Crisis Line. If
  someone is hurting you at home, the National Domestic Violence Hotline
  is 1-800-799-7233. Once you’re stable and looking for longer-term work,
  I’d be glad to help.
