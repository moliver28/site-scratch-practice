name: Cancelling and rescheduling
type: faq
question: What if I need to cancel or reschedule?
answer: >-
  Life happens. Email or call as soon as you know and we’ll find another
  time; I’d much rather move a session than have you white-knuckle it
  through a bad week. The specific notice window and any fees are spelled
  out plainly before we start treatment, so nothing catches you by
  surprise later.
