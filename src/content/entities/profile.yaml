name: Kara Hokes, PhD
type: profile
summary: >-
  I’m Kara. I’ve spent almost 10 years working with adults whose lives
  have been significantly impacted by trauma. Before private practice I
  directed a counseling program for first responders and worked for many
  years at Veterans Affairs as a clinical psychologist. What I’ve learned
  is that trauma is not a life sentence — it is a treatable condition, and
  the treatments genuinely work.
