name: Confidentiality
type: faq
question: Is what I share confidential?
answer: >-
  Yes. The legal exceptions are few, and I’ll walk you through them in our
  first session: imminent risk of serious harm to yourself or someone
  else, suspected abuse of a child or vulnerable adult, and court orders.
  Sessions run on a HIPAA-compliant video platform, nothing is recorded on
  either side, and your records live in an encrypted system.
