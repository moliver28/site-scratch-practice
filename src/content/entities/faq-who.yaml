name: Who I work with
type: faq
question: Who do you work with?
answer: >-
  Veterans and first responders, survivors of sexual and domestic
  violence, and people who have caused harm and want to stop. Also the
  communities too often overlooked in care: queer and trans folks, people
  of color, immigrants, elders, and anyone immunocompromised or chronically
  ill who’s tired of explaining that part of their life. Individuals of all
  backgrounds and cultures are welcome, and I see individuals.
