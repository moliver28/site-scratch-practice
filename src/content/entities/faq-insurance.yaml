name: Taking insurance
type: faq
question: Do you take insurance?
answer: >-
  Yes. I accept Aetna, Aetna Medicare, Ambetter, Blue Cross, BlueCross
  BlueShield, Carelon Behavioral Health, Cigna EAP (that’s an Employee
  Assistance Program; if your employer offers one, sessions may be
  covered), Curative, Medicare, Moda Health, Optum, Oxford, Premera Blue
  Cross, Providence, Regence, and the Velocity National Provider Network.
  I’m licensed in Washington State, so insurance covers clients who live
  here. Before we start, I’ll help you confirm exactly what your plan
  covers so nothing about cost comes as a surprise.
