name: TriCare and VA Community Care
type: faq
question: Do you take TriCare or VA Community Care?
answer: >-
  I’m not currently in network with Tricare or VA Community Care — my
  credentialing request is still being processed. If you’d like, I can add
  you to a waitlist and reach out when credentialing is approved. In the
  meantime, if you carry a civilian plan from the list above, we can use
  that, or you can pay out of network with a superbill. Vet Centers also
  provide free counseling to veterans and their families, and ptsd.va.gov
  can help you find one.
