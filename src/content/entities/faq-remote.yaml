name: Remote sessions
type: faq
question: Are sessions really all remote?
answer: >-
  Yes, and on purpose. Every session happens over secure video, which is
  how I can see clients anywhere in Washington State and, for private-pay
  clients (paying directly instead of using insurance), in the 40-plus
  states participating in PSYPACT. Research comparing video therapy with
  in-person care for trauma has repeatedly found the outcomes come out
  about the same, and there’s one real advantage: you do hard work from a
  room that already feels safe. You need a private spot, headphones if you
  have them, and a connection steady enough for video; a phone works in a
  pinch.
