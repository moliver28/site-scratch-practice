name: Privacy from employers
type: faq
question: Will my employer or the military find out I’m in therapy?
answer: >-
  Confidentiality is one of my highest priorities. What you say stays
  between us except for the few legal exceptions above. One honest caveat:
  if we bill your insurance, the plan processes the claim and may send its
  own paperwork to your home. If you’d rather keep therapy entirely
  outside any insurance record, private pay is always an option. We can
  talk through both on the free call and you decide what is best for you.
