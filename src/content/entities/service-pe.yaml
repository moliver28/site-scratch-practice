name: Prolonged Exposure (PE)
type: service
badge: Evidence-based
description: >-
  A structured PTSD treatment built on one finding: avoidance keeps the
  wound open. Step by step, at a pace your nervous system agrees to, you
  retell the story and revisit the safe places you’ve been steering
  around, and learn the memories themselves are not dangerous. One of the
  strongest evidence bases in trauma care.
