name: If you have hurt someone
type: faq
question: I’ve hurt someone. Can I still come to therapy?
answer: >-
  Yes. Part of my practice is working with people who have used violence,
  or caused sexual or domestic harm, and want to stop for good. You’ll be
  treated with respect, and you’ll also be held accountable: this work
  means understanding what drove the harm and building relationships that
  are actually safe. If a court or another agency is requiring treatment,
  tell me exactly what’s required and I’ll be honest about whether I can
  provide it.
